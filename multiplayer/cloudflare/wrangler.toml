# Enceladus shared-world relay on Cloudflare Workers (free plan). Deploy from this folder: npx wrangler deploy
name = "enceladus-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOW_ORIGINS = "https://enceladus.spaceoceancorp.com,https://enceladus-globe.vercel.app"
MAX_CLIENTS = "300"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

# the free plan needs SQLite-backed Durable Objects; this one keeps nothing in storage anyway
[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]
