<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enceladus Globe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Widgets/widgets.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:rgba(22,24,30,.92);--panel-solid:#16181e;--line:rgba(255,255,255,.12);
  --text:#e9edf3;--muted:#9aa4b2;--accent:#8ab4f8;--stripe:#7ee2ff;--jet:#ffd36b;
  --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
#globe{position:absolute;inset:0}
.cesium-viewer-bottom,.cesium-widget-credits{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#search{position:absolute;top:16px;left:16px;width:380px;max-width:calc(100vw - 32px);z-index:5}
#search .bar{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:48px;border-radius:24px}
#search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:15px;outline:none;min-width:0}
#search input::placeholder{color:var(--muted)}
.iconbtn{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
#results{margin-top:6px;max-height:50vh;overflow:auto;display:none;padding:6px 0}
#results.open{display:block}
#results button{display:flex;width:100%;gap:10px;align-items:baseline;padding:8px 14px;background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
#results button:hover,#results button.sel{background:rgba(138,180,248,.12)}
#results small{color:var(--muted)}
#info{position:absolute;top:76px;left:16px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 160px);overflow:auto;padding:18px;display:none;z-index:4}
#info.open{display:block}
#info h2{margin:0 0 2px;font-size:22px;font-weight:600}
#info .type{color:var(--muted);margin-bottom:14px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
#info dt{color:var(--muted)}#info dd{margin:0;font-variant-numeric:tabular-nums}
#info p{margin:0 0 12px;color:#cfd6e0}
#info a{color:var(--accent);text-decoration:none}#info a:hover{text-decoration:underline}
#info .close{position:absolute;top:10px;right:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:rgba(126,226,255,.14);color:var(--stripe);margin-left:6px;vertical-align:middle}
#layers{position:absolute;left:16px;bottom:44px;z-index:3;display:flex;gap:8px;align-items:flex-end}
.layerbtn{width:76px;height:76px;border-radius:10px;border:2px solid #fff;overflow:hidden;position:relative;cursor:pointer;padding:0;background:#222;box-shadow:var(--shadow)}
.layerbtn img{width:100%;height:100%;object-fit:cover;display:block}
.layerbtn span{position:absolute;left:0;right:0;bottom:0;padding:3px 0;font-size:11px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.layerbtn.active{border-color:var(--accent)}
#opts{padding:12px 14px;min-width:230px;font-size:13px}
#opts label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
#opts .row{display:flex;justify-content:space-between;color:var(--muted);margin-top:8px}
#opts input[type=range]{width:100%;accent-color:var(--accent)}
#opts input[type=checkbox]{accent-color:var(--accent)}
#ctrls{position:absolute;right:16px;bottom:44px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:center}
#ctrls .grp{display:flex;flex-direction:column;border-radius:10px;overflow:hidden}
#ctrls button{width:40px;height:40px;border:0;background:var(--panel-solid);color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center}
#ctrls button+button{border-top:1px solid var(--line)}
#ctrls button:hover{background:#262a33}
#compass svg{transition:transform .08s linear}
#status{position:absolute;right:0;bottom:0;left:0;height:28px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 14px;font-size:12px;color:var(--muted);background:rgba(10,11,14,.78);z-index:3;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#status a{color:var(--muted)}
#scale{display:flex;align-items:center;gap:6px}
#scale i{display:block;height:6px;border:1px solid var(--muted);border-top:0}
#credit{margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);z-index:10;pointer-events:none;transition:opacity .6s}
@media (max-width:640px){
  #search{width:auto;right:16px}
  #info{top:auto;bottom:150px;left:16px;right:16px;width:auto;max-height:40vh}
  .layerbtn{width:60px;height:60px}
  #layers{flex-wrap:wrap;right:72px}
  #opts{min-width:0;width:100%;order:-1;padding:8px 12px}
  #credit{display:none}
}
</style>
</head>
<body>
<div id="globe"></div>
<div id="loading">Loading Enceladus…</div>

<div id="search">
  <div class="card bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" placeholder="Search Enceladus: craters, sulci, jets, high-res" autocomplete="off" spellcheck="false">
    <button class="iconbtn" id="clearq" title="Clear" aria-label="Clear">✕</button>
  </div>
  <div class="card" id="results"></div>
</div>

<div class="card" id="info">
  <button class="iconbtn close" id="infoclose" aria-label="Close">✕</button>
  <div id="infobody"></div>
</div>

<div id="layers">
  <button class="layerbtn active" data-layer="mosaic"><img src="tiles/mosaic/0/1/0.jpg" alt=""><span>Imagery</span></button>
  <button class="layerbtn" data-layer="relief"><img src="tiles/relief/0/1/0.jpg" alt=""><span>Topography</span></button>
  <button class="layerbtn" data-layer="hybrid"><img src="tiles/mosaic/0/0/0.jpg" alt=""><span>Hybrid</span></button>
  <div class="card" id="opts">
    <label><input type="checkbox" id="optLabels" checked> Feature names</label>
    <label><input type="checkbox" id="optJets" checked> Plume jet sources (100)</label>
    <label id="optHiresRow"><input type="checkbox" id="optHires" checked> High-res Cassini areas</label>
    <label><input type="checkbox" id="optGrid"> Latitude / longitude grid</label>
    <div class="row"><span>Terrain exaggeration</span><span id="exagv">4×</span></div>
    <input type="range" id="exag" min="0" max="20" step="0.5" value="4">
  </div>
</div>

<div id="ctrls">
  <div class="grp card"><button id="compass" title="Reset north and tilt"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l4 10h-8z" fill="#ea4335"/><path d="M12 22l-4-10h8z" fill="#cfd6e0"/></svg></button></div>
  <div class="grp card"><button id="tilt" title="Tilt view">3D</button></div>
  <div class="grp card"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button></div>
  <div class="grp card"><button id="home" title="Whole moon">⌂</button></div>
</div>

<div id="status">
  <span id="credit">Imagery and topography: Cassini ISS, Schenk &amp; McKinnon (2024), LPI/USRA, via USGS · Names: IAU/USGS Gazetteer · Jets: Porco et al. (2014) · <a href="https://github.com/SpaceOceanCorp/enceladus-ready" target="_blank" rel="noopener">enceladus-ready</a></span>
  <span id="scale"><i></i><span></span></span>
  <span id="cursor">—</span>
  <span id="cam"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.123.0/Cesium.js"></script>
<script src="features.js"></script>
<script src="hires.js" onerror="window.ENC_HIRES=null"></script>
<script>
(() => {
const C = Cesium;
// Display sphere. Terrain heights carry the triaxial shape and DEM relief on top of it.
const R = 252100;
const E = new C.Ellipsoid(R, R, R);
C.Ellipsoid.default = E;
const TS = new C.GeographicTilingScheme({ ellipsoid: E });

// Reference ellipsoid of the Schenk & McKinnon (2024) DEM, long axis at 4.15 W.
const A = 256200, B = 251400, Cc = 248600, AX = -4.15 * Math.PI / 180;
function ellR(lat, lon) {
  const cl = Math.cos(lat), d = lon - AX;
  return 1 / Math.sqrt((cl * Math.cos(d) / A) ** 2 + (cl * Math.sin(d) / B) ** 2 + (Math.sin(lat) / Cc) ** 2);
}

// ---------- terrain ----------
const MAXT = 5, N = 65, cache = new Map();
function loadT(x, y, z) {
  const k = z + '/' + x + '/' + y;
  if (!cache.has(k)) cache.set(k, fetch('terrain/' + k + '.bin').then(r => r.arrayBuffer()).then(b => new Int16Array(b)));
  return cache.get(k);
}
const terrain = new C.CustomHeightmapTerrainProvider({
  width: N, height: N, tilingScheme: TS, ellipsoid: E,
  callback: (x, y, z) => {
    if (z <= MAXT) return loadT(x, y, z).then(a => Float32Array.from(a));
    const s = 1 << (z - MAXT), px = Math.floor(x / s), py = Math.floor(y / s), ox = x % s, oy = y % s;
    return loadT(px, py, MAXT).then(a => {
      const out = new Float32Array(N * N), f = (N - 1) / s;
      for (let j = 0; j < N; j++) {
        const v = oy * f + j * f / (N - 1), j0 = Math.min(Math.floor(v), N - 2), tv = v - j0;
        for (let i = 0; i < N; i++) {
          const u = ox * f + i * f / (N - 1), i0 = Math.min(Math.floor(u), N - 2), tu = u - i0;
          const a00 = a[j0 * N + i0], a01 = a[j0 * N + i0 + 1], a10 = a[(j0 + 1) * N + i0], a11 = a[(j0 + 1) * N + i0 + 1];
          out[j * N + i] = (a00 * (1 - tu) + a01 * tu) * (1 - tv) + (a10 * (1 - tu) + a11 * tu) * tv;
        }
      }
      return out;
    });
  }
});

// ---------- viewer ----------
const viewer = new C.Viewer('globe', {
  globe: new C.Globe(E), mapProjection: new C.GeographicProjection(E), terrainProvider: terrain,
  baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, skyAtmosphere: false, msaaSamples: 4,
});
const scene = viewer.scene, globe = scene.globe, camera = scene.camera;
globe.showGroundAtmosphere = false; globe.enableLighting = false; globe.baseColor = C.Color.fromCssColorString('#1b1d22');
globe.maximumScreenSpaceError = 1.5; globe.depthTestAgainstTerrain = true; globe.tileCacheSize = 400;
scene.fog.enabled = false; if (scene.sun) scene.sun.show = false; if (scene.moon) scene.moon.show = false;
scene.verticalExaggeration = 4;
const ssc = scene.screenSpaceCameraController;
ssc.minimumZoomDistance = 800; ssc.maximumZoomDistance = 6e6;
ssc.inertiaZoom = 0.85;

// ---------- free trackball rotation and moving the globe on screen ----------
// Cesium's own left-drag spin keeps north up, stops at the poles and jumps near the limb.
// Here: drag on the moon rotates it freely in any direction, over the poles and on and on,
// with smoothing and inertia. Drag in empty space (or Shift+drag) moves the whole globe
// around the screen; it is never allowed to leave the screen.
camera.constrainedAxis = undefined;
ssc.enableRotate = false; ssc.enableLook = false;
const ORIGIN = C.Cartesian3.ZERO;
const focalPx = () => (scene.canvas.clientHeight / 2) / Math.tan(camera.frustum.fovy / 2);
const drag = { mode: null, x: 0, y: 0, k: 0, pendX: 0, pendY: 0, velX: 0, velY: 0, id: null };
function hitsGlobe(x, y) {
  // Terrain pick when tiles are loaded, else the display sphere, so a grab on the moon always spins it.
  const w = new C.Cartesian2(x, y), r = camera.getPickRay(w);
  return (r && globe.pick(r, scene)) || camera.pickEllipsoid(w, E);
}
function rotateBy(dx, dy, k) {
  // Turn the moon so the surface follows the pointer: right-drag turns it to the right.
  if (dx) camera.rotate(camera.up, dx * k);
  if (dy) camera.rotate(camera.right, dy * k);
}
function shiftScreen(dx, dy) {
  // Move the globe's image dx px right and dy px down by turning the camera in place.
  const f = focalPx();
  if (dx) camera.look(camera.up, -Math.atan(dx / f));
  if (dy) camera.look(camera.right, -Math.atan(dy / f));
}
function discOnScreen() {
  const d = C.Cartesian3.magnitude(camera.positionWC);
  const toC = C.Cartesian3.normalize(C.Cartesian3.negate(camera.positionWC, new C.Cartesian3()), new C.Cartesian3());
  if (C.Cartesian3.dot(toC, camera.directionWC) <= 0.05) return null;
  const p = C.SceneTransforms.worldToWindowCoordinates(scene, ORIGIN);
  if (!p) return null;
  return { x: p.x, y: p.y, r: focalPx() * Math.tan(Math.asin(Math.min(1, R / d))), d };
}
function clampDisc() {
  // Keep the whole disc on screen when it fits; when it is bigger than the screen, keep it covering the middle.
  const c = discOnScreen(); if (!c) return;
  const w = scene.canvas.clientWidth, h = scene.canvas.clientHeight, m = 8;
  const lim = (v, r, size) => r * 2 + 2 * m <= size ? Math.min(Math.max(v, r + m), size - r - m) : Math.min(Math.max(v, size - r), r);
  const sb = 28; // status bar
  const cx = lim(c.x, c.r, w), cy = lim(c.y, c.r, h - sb);
  if (Math.abs(cx - c.x) > 0.5 || Math.abs(cy - c.y) > 0.5) shiftScreen(cx - c.x, cy - c.y);
}
const cv = scene.canvas;
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.ctrlKey || e.altKey || drag.id !== null) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = !e.shiftKey && hitsGlobe(x, y);
  camera.cancelFlight();
  drag.mode = hit ? 'spin' : 'move'; drag.x = x; drag.y = y; drag.id = e.pointerId;
  drag.velX = drag.velY = 0; drag.pendX = drag.pendY = 0;
  const dist = hit ? C.Cartesian3.distance(camera.positionWC, hit) : C.Cartesian3.magnitude(camera.positionWC) - R;
  drag.k = Math.max(dist, 200) / (R * focalPx());
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== drag.id) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  drag.pendX += x - drag.x; drag.pendY += y - drag.y; drag.x = x; drag.y = y; drag.t = performance.now();
});
const endDrag = e => {
  if (e.pointerId !== drag.id) return;
  drag.id = null;
  // Coast only if the pointer was still moving when released, and never faster than 25 px per frame.
  const v = Math.hypot(drag.velX, drag.velY), cap = 25;
  if (drag.mode === 'spin' && performance.now() - (drag.t || 0) < 90 && v > 0.3) {
    if (v > cap) { drag.velX *= cap / v; drag.velY *= cap / v; }
    drag.mode = 'coast';
  } else if (drag.mode === 'spin') { drag.velX = drag.velY = 0; drag.mode = 'coast'; }
  writeHash();
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
// Two-finger touch belongs to Cesium's pinch zoom and tilt.
cv.addEventListener('touchstart', e => { if (e.touches.length > 1) { drag.id = null; drag.mode = null; drag.pendX = drag.pendY = 0; } }, { passive: true });
scene.preRender.addEventListener(() => {
  if (drag.mode === 'spin' || drag.mode === 'move') {
    // Ease toward the pointer instead of jumping: apply half of what is pending each frame.
    const sx = drag.pendX * 0.5, sy = drag.pendY * 0.5;
    drag.pendX -= sx; drag.pendY -= sy;
    if (drag.mode === 'spin') { rotateBy(sx, sy, drag.k); drag.velX = drag.velX * 0.7 + sx * 0.3; drag.velY = drag.velY * 0.7 + sy * 0.3; }
    else shiftScreen(sx, sy);
    if (drag.id === null && drag.mode === 'move') drag.mode = null;
  } else if (drag.mode === 'coast') {
    rotateBy(drag.velX + drag.pendX * 0.5, drag.velY + drag.pendY * 0.5, drag.k);
    drag.pendX *= 0.5; drag.pendY *= 0.5; drag.velX *= 0.92; drag.velY *= 0.92;
    if (Math.hypot(drag.velX, drag.velY) < 0.05 && Math.hypot(drag.pendX, drag.pendY) < 0.2) { drag.mode = null; writeHash(); }
  }
  clampDisc();
});

const mk = (name, max) => new C.UrlTemplateImageryProvider({ url: 'tiles/' + name + '/{z}/{x}/{y}.jpg', tilingScheme: TS, maximumLevel: max, tileWidth: 256, tileHeight: 256 });
const mosaic = viewer.imageryLayers.addImageryProvider(mk('mosaic', __MOSAIC_MAX__));
const relief = viewer.imageryLayers.addImageryProvider(mk('relief', __RELIEF_MAX__));
relief.show = false;

// High-resolution Cassini insets: extra zoom levels only where they exist, transparent elsewhere.
const HI = window.ENC_HIRES;
let hires = null;
if (HI && HI.tiles.length) {
  const have = new Set(HI.tiles), blank = document.createElement('canvas'); blank.width = blank.height = 1;
  const maxHi = Math.max(...HI.tiles.map(k => +k.split('/')[0]));
  const hp = new C.UrlTemplateImageryProvider({ url: 'tiles/hires/{z}/{x}/{y}.webp?v=' + (HI.version || 0), tilingScheme: TS, maximumLevel: maxHi, tileWidth: 256, tileHeight: 256, hasAlphaChannel: true,
    rectangle: C.Rectangle.fromDegrees(-180, -90, 180, -60) });
  const req = hp.requestImage.bind(hp);
  hp.requestImage = (x, y, l, r) => have.has(l + '/' + x + '/' + y) ? req(x, y, l, r) : Promise.resolve(blank);
  hires = viewer.imageryLayers.addImageryProvider(hp, 1);
} else document.getElementById('optHiresRow').classList.add('hide');
const grid = viewer.imageryLayers.addImageryProvider(new C.GridImageryProvider({ tilingScheme: TS, cells: 2, color: C.Color.fromCssColorString('rgba(138,180,248,0.55)'), glowColor: C.Color.TRANSPARENT, backgroundColor: C.Color.TRANSPARENT, glowWidth: 0 }));
grid.show = false;

function setLayer(name) {
  mosaic.show = name !== 'relief'; relief.show = name !== 'mosaic';
  if (hires) hires.show = mosaic.show && document.getElementById('optHires').checked; relief.alpha = name === 'hybrid' ? 0.45 : 1;
  document.querySelectorAll('.layerbtn').forEach(b => b.classList.toggle('active', b.dataset.layer === name));
  state.layer = name; writeHash();
}

// ---------- labels and jets ----------
const feats = window.ENC_FEATURES, jets = window.ENC_JETS;
const STRIPES = new Set(['Alexandria Sulcus', 'Cairo Sulcus', 'Baghdad Sulcus', 'Damascus Sulcus']);
const labelSrc = new C.CustomDataSource('labels'), jetSrc = new C.CustomDataSource('jets');
viewer.dataSources.add(labelSrc); viewer.dataSources.add(jetSrc);
const typeColor = { Crater: '#ffffff', Sulcus: '#7ee2ff', Fossa: '#ffb48a', Planitia: '#c7f59a', Dorsum: '#e6b8ff', Rupes: '#ffd36b' };
feats.forEach(f => {
  f.kind = 'feature';
  const big = f.type === 'Planitia' || STRIPES.has(f.name);
  const far = big ? 2.2e6 : Math.max(f.diameter_km * 1000 * 7, 250e3);
  f.entity = labelSrc.entities.add({
    position: C.Cartesian3.fromDegrees(f.lon, f.lat, 0, E),
    point: { pixelSize: f.type === 'Crater' ? 5 : 6, color: C.Color.fromCssColorString(typeColor[f.type] || '#fff'), outlineColor: C.Color.BLACK, outlineWidth: 1.5, eyeOffset: new C.Cartesian3(0, 0, -3000), distanceDisplayCondition: new C.DistanceDisplayCondition(0, far) },
    label: { text: f.name, font: (big ? '600 15px' : '500 13px') + ' Inter, sans-serif', fillColor: C.Color.fromCssColorString(STRIPES.has(f.name) ? '#7ee2ff' : '#f2f4f8'), outlineColor: C.Color.fromCssColorString('#000000cc'), outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new C.Cartesian2(0, -14), eyeOffset: new C.Cartesian3(0, 0, -3000), distanceDisplayCondition: new C.DistanceDisplayCondition(0, far) },
    properties: { ref: f },
  });
});
jets.forEach(j => {
  j.kind = 'jet'; j.name = j.id.replace('Jet', 'Jet ');
  j.entity = jetSrc.entities.add({
    position: C.Cartesian3.fromDegrees(j.lon, j.lat, 0, E),
    point: { pixelSize: 7, color: C.Color.fromCssColorString('#ffd36b').withAlpha(.95), outlineColor: C.Color.fromCssColorString('#ff7a00'), outlineWidth: 2, eyeOffset: new C.Cartesian3(0, 0, -3000), distanceDisplayCondition: new C.DistanceDisplayCondition(0, 1.6e6), scaleByDistance: new C.NearFarScalar(2e4, 1.5, 1.2e6, .35) },
    properties: { ref: j },
  });
});
const areaSrc = new C.CustomDataSource('hires'); viewer.dataSources.add(areaSrc);
const AREA_NAMES = { wide: 'South polar high-res mosaic', detail_01: 'Pole close-up (10 m)', detail_02: 'Tiger stripe close-up (10 m)' };
const areas = (HI && HI.areas || []).map(a => {
  const o = { ...a, kind: 'area', id: 'hires-' + a.name, name: AREA_NAMES[a.name] || ('High-res ' + a.name), type: 'High-res Cassini imagery', diameter_km: Math.sqrt(a.km2) };
  const col = C.Color.fromCssColorString(a.spacing_m <= 12 ? '#ff9de2' : '#ffd36b');
  o.lines = a.rings.map(ring => areaSrc.entities.add({
    polyline: { positions: new C.CallbackProperty(() => ring.map(([la, lo, h]) => C.Cartesian3.fromDegrees(lo, la, h * scene.verticalExaggeration + 250, E)), false),
      width: 2, material: col.withAlpha(.9), depthFailMaterial: col.withAlpha(.35), arcType: C.ArcType.NONE },
    properties: { ref: o },
  }));
  o.entity = areaSrc.entities.add({
    position: C.Cartesian3.fromDegrees(a.lon, a.lat, 0, E),
    label: { text: o.name + ' · ' + a.spacing_m + ' m', font: '600 13px Inter, sans-serif', fillColor: col, outlineColor: C.Color.fromCssColorString('#000000cc'), outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE, eyeOffset: new C.Cartesian3(0, 0, -3000), distanceDisplayCondition: new C.DistanceDisplayCondition(0, a.name === 'wide' ? 1.2e6 : 300e3) },
    properties: { ref: o },
  });
  return o;
});
// Keep markers on the surface: they need the exaggerated terrain height.
async function placeOnTerrain() {
  const all = [...feats, ...jets, ...areas];
  const carto = all.map(o => C.Cartographic.fromDegrees(o.lon, o.lat));
  try { await C.sampleTerrain(terrain, 4, carto); } catch (e) { console.warn(e); return; }
  all.forEach((o, i) => { o.h = carto[i].height; });
  updateHeights();
}
function updateHeights() {
  const ex = scene.verticalExaggeration;
  [...feats, ...jets, ...areas].forEach(o => { if (o.h !== undefined) o.entity.position = C.Cartesian3.fromDegrees(o.lon, o.lat, o.h * ex + 300, E); });
}

// ---------- info panel ----------
const fmt = (v, d = 2) => Math.abs(v).toFixed(d) + '°' ;
const ll = (lat, lon) => fmt(lat) + (lat >= 0 ? 'N' : 'S') + ', ' + fmt(lon) + (lon >= 0 ? 'E' : 'W');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function demHeight(o) { return o.h === undefined ? null : (R + o.h) - ellR(o.lat * Math.PI / 180, o.lon * Math.PI / 180); }
function showInfo(o) {
  const el = document.getElementById('infobody'); let h;
  const dh = demHeight(o);
  if (o.kind === 'area') {
    const fl = o.dates.map(d => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' }));
    h = `<h2>${esc(o.name)}</h2><div class="type">High-resolution Cassini imagery</div>
      <dl><dt>Detail</dt><dd>${o.spacing_m} m per pixel (global map: 100 m)</dd>
      <dt>Area</dt><dd>${o.km2.toLocaleString()} km²</dd>
      <dt>Center</dt><dd>${ll(o.lat, o.lon)}</dd>
      <dt>Frames</dt><dd>${o.frames.length} Cassini ISS narrow-angle</dd>
      <dt>Flybys</dt><dd>${fl.map(esc).join('<br>')}</dd></dl>
      <p>Zoom in inside the outline for the sharper view. Each frame was matched to the global mosaic, so placement is good to about 100 m. The fine detail is real imagery; heights underneath stay at the DEM's 400 m. Shadows come from a low Sun on each flyby date.</p>
      <a href="https://pds-rings.seti.org/search/" target="_blank" rel="noopener">Source frames: PDS Ring-Moon Systems Node ↗</a>`;
  } else if (o.kind === 'jet') {
    h = `<h2>${esc(o.name)}</h2><div class="type">Plume jet source · ${esc(o.sulcus)} Sulcus</div>
      <dl><dt>Location</dt><dd>${ll(o.lat, o.lon)}</dd>
      ${dh !== null ? `<dt>Elevation</dt><dd>${(dh / 1000).toFixed(2)} km vs. reference ellipsoid</dd>` : ''}
      <dt>Tilt from vertical</dt><dd>${o.tilt == null ? 'not given' : o.tilt + '°'}</dd>
      <dt>Relative sightings</dt><dd>${o.sightings}</dd>
      <dt>Confidence</dt><dd>${esc(o.confidence.replace(/_/g, ' '))}</dd></dl>
      <p>One of 100 jet sources triangulated from Cassini images by Porco et al. (2014), Astronomical Journal 148:45. Other teams read the same activity as curtain eruptions along the fractures.</p>`;
  } else {
    h = `<h2>${esc(o.name)}${STRIPES.has(o.name) ? '<span class="pill">tiger stripe</span>' : ''}</h2><div class="type">${esc(o.type)}</div>
      <dl><dt>Center</dt><dd>${ll(o.lat, o.lon)}</dd>
      <dt>Size</dt><dd>${o.diameter_km ? o.diameter_km.toFixed(1) + ' km' : '—'}</dd>
      ${dh !== null ? `<dt>Elevation</dt><dd>${(dh / 1000).toFixed(2)} km vs. reference ellipsoid</dd>` : ''}</dl>
      <p><b>Name origin:</b> ${esc(o.origin)}</p>
      <a href="${esc(o.link)}" target="_blank" rel="noopener">USGS Gazetteer entry ↗</a>`;
  }
  el.innerHTML = h; document.getElementById('info').classList.add('open');
  state.sel = o.kind === 'feature' ? o.name : o.id; writeHash();
}
function closeInfo() { document.getElementById('info').classList.remove('open'); state.sel = null; writeHash(); }
document.getElementById('infoclose').onclick = closeInfo;

function flyTo(o, now) {
  const range = o.kind === 'jet' ? 35e3 : o.kind === 'area' ? Math.min(Math.sqrt(o.km2) * 1000 * 2.2, 380e3) : Math.min(Math.max((o.diameter_km || 30) * 1000 * 2.4, 45e3), 420e3);
  const target = C.Cartesian3.fromDegrees(o.lon, o.lat, (o.h || 0) * scene.verticalExaggeration, E);
  const hpr = new C.HeadingPitchRange(0, C.Math.toRadians(range > 250e3 ? -70 : -48), range);
  if (now) camera.lookAt(target, hpr), camera.lookAtTransform(C.Matrix4.IDENTITY);
  else camera.flyToBoundingSphere(new C.BoundingSphere(target, 1), { offset: hpr, duration: 2.2 });
  showInfo(o);
}

const handler = new C.ScreenSpaceEventHandler(scene.canvas);
handler.setInputAction(e => {
  const p = scene.pick(e.position);
  if (p && p.id && p.id.properties) flyTo(p.id.properties.ref.getValue(), false);
}, C.ScreenSpaceEventType.LEFT_CLICK);

// ---------- cursor readout ----------
const cursorEl = document.getElementById('cursor');
let lastMove = 0;
handler.setInputAction(e => {
  const t = performance.now(); if (drag.id !== null || t - lastMove < 60) return; lastMove = t;
  const ray = camera.getPickRay(e.endPosition); const p = ray && globe.pick(ray, scene);
  if (!p) { cursorEl.textContent = '—'; return; }
  const c = E.cartesianToCartographic(p); if (!c) return;
  const lat = c.latitude, lon = c.longitude, ex = scene.verticalExaggeration || 1;
  const r = R + c.height / (ex || 1);
  const dh = ex > 0 ? (r - ellR(lat, lon)) / 1000 : null;
  cursorEl.textContent = ll(lat * 180 / Math.PI, lon * 180 / Math.PI) + (dh !== null ? '  ·  ' + (dh >= 0 ? '+' : '') + dh.toFixed(2) + ' km' : '');
}, C.ScreenSpaceEventType.MOUSE_MOVE);

// ---------- search ----------
const q = document.getElementById('q'), res = document.getElementById('results');
const index = [...areas, ...feats, ...jets];
let hits = [], selI = 0;
function render() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.classList.remove('open'); return; }
  hits = index.filter(o => o.name.toLowerCase().includes(s) || (o.type || o.sulcus || '').toLowerCase().includes(s) || (o.kind === 'area' && /hi|res|detail|cassini/.test(s)))
    .sort((a, b) => (b.name.toLowerCase().startsWith(s)) - (a.name.toLowerCase().startsWith(s)) || (b.diameter_km || 0) - (a.diameter_km || 0)).slice(0, 30);
  selI = 0;
  res.innerHTML = hits.length ? hits.map((o, i) => `<button data-i="${i}" class="${i === 0 ? 'sel' : ''}"><span>${esc(o.name)}</span><small>${o.kind === 'jet' ? 'Jet · ' + esc(o.sulcus) : o.kind === 'area' ? 'High-res · ' + o.spacing_m + ' m' : esc(o.type)} · ${ll(o.lat, o.lon)}</small></button>`).join('')
    : '<div style="padding:8px 14px;color:var(--muted)">No named feature matches.</div>';
  res.classList.add('open');
}
q.addEventListener('input', render);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); selI = (selI + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; res.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sel', i === selI)); }
  if (e.key === 'Enter' && hits[selI]) { pick(hits[selI]); }
  if (e.key === 'Escape') { res.classList.remove('open'); q.blur(); }
});
res.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(hits[+b.dataset.i]); });
function pick(o) { q.value = o.name; res.classList.remove('open'); flyTo(o, false); }
document.getElementById('clearq').onclick = () => { q.value = ''; render(); closeInfo(); };

// ---------- options ----------
document.querySelectorAll('.layerbtn').forEach(b => b.onclick = () => setLayer(b.dataset.layer));
document.getElementById('optLabels').onchange = e => { labelSrc.show = e.target.checked; };
document.getElementById('optJets').onchange = e => { jetSrc.show = e.target.checked; };
document.getElementById('optHires').onchange = e => { areaSrc.show = e.target.checked; if (hires) hires.show = e.target.checked && mosaic.show; };
document.getElementById('optGrid').onchange = e => { grid.show = e.target.checked; };
const exag = document.getElementById('exag');
exag.oninput = () => { scene.verticalExaggeration = +exag.value; document.getElementById('exagv').textContent = exag.value + '×'; updateHeights(); state.ex = +exag.value; writeHash(); };

// ---------- camera controls ----------
const HOME = { lon: 0, lat: -20, alt: 1.15e6 };
function home() { camera.flyTo({ destination: C.Cartesian3.fromDegrees(HOME.lon, HOME.lat, HOME.alt, E), orientation: { heading: 0, pitch: -Math.PI / 2, roll: 0 }, duration: 1.6 }); }
document.getElementById('home').onclick = home;
document.getElementById('zin').onclick = () => camera.zoomIn(camera.positionCartographic.height * 0.45);
document.getElementById('zout').onclick = () => camera.zoomOut(camera.positionCartographic.height * 0.8);
function centerPoint() {
  const c = scene.canvas, ray = camera.getPickRay(new C.Cartesian2(c.clientWidth / 2, c.clientHeight / 2));
  return (ray && globe.pick(ray, scene)) || null;
}
function orbitTo(pitchDeg, heading) {
  // Re-centres the globe on screen too. Uses the point at screen centre, or the moon's centre if that misses.
  let target = centerPoint(), range;
  if (target) range = C.Cartesian3.distance(camera.positionWC, target);
  else { target = C.Cartesian3.ZERO; range = C.Cartesian3.magnitude(camera.positionWC); pitchDeg = -90; }
  camera.flyToBoundingSphere(new C.BoundingSphere(target, 1), { offset: new C.HeadingPitchRange(heading, C.Math.toRadians(pitchDeg), range), duration: 1.0 });
}
document.getElementById('compass').onclick = () => orbitTo(-90, 0);
document.getElementById('tilt').onclick = () => orbitTo(C.Math.toDegrees(camera.pitch) < -75 ? -40 : -90, camera.heading);
const needle = document.querySelector('#compass svg');

// ---------- scale bar, hash ----------
const scaleBar = document.querySelector('#scale i'), scaleTxt = document.querySelector('#scale span'), camEl = document.getElementById('cam');
function updateScale() {
  const c = scene.canvas, w = c.clientWidth, hgt = c.clientHeight;
  const r1 = camera.getPickRay(new C.Cartesian2(w / 2, hgt - 40)), r2 = camera.getPickRay(new C.Cartesian2(w / 2 + 100, hgt - 40));
  const p1 = r1 && globe.pick(r1, scene), p2 = r2 && globe.pick(r2, scene);
  if (!p1 || !p2) { scaleBar.style.width = '0'; scaleTxt.textContent = ''; return; }
  const mpp = C.Cartesian3.distance(p1, p2) / 100;
  const nice = [100, 200, 500, 1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5].find(v => v / mpp >= 50) || 5e5;
  scaleBar.style.width = Math.round(nice / mpp) + 'px'; scaleTxt.textContent = nice >= 1000 ? nice / 1000 + ' km' : nice + ' m';
}
const state = { layer: 'mosaic', ex: 4, sel: null };
function writeHash() {
  const c = camera.positionCartographic; if (!c) return;
  const s = `#@${C.Math.toDegrees(c.latitude).toFixed(4)},${C.Math.toDegrees(c.longitude).toFixed(4)},${Math.round(c.height)}a,${C.Math.toDegrees(camera.heading).toFixed(1)}h,${C.Math.toDegrees(camera.pitch).toFixed(1)}t`
    + `/l=${state.layer}/x=${state.ex}` + (state.sel ? '/f=' + encodeURIComponent(state.sel) : '');
  history.replaceState(null, '', s);
}
function readHash() {
  const m = location.hash.match(/@(-?[\d.]+),(-?[\d.]+),(\d+)a,(-?[\d.]+)h,(-?[\d.]+)t/);
  const kv = Object.fromEntries((location.hash.split('/').slice(1)).map(p => p.split('=')).filter(p => p.length === 2));
  if (kv.l && ['mosaic', 'relief', 'hybrid'].includes(kv.l)) setLayer(kv.l);
  if (kv.x && isFinite(+kv.x)) { exag.value = kv.x; exag.oninput(); }
  if (m) camera.setView({ destination: C.Cartesian3.fromDegrees(+m[2], +m[1], +m[3], E), orientation: { heading: C.Math.toRadians(+m[4]), pitch: C.Math.toRadians(+m[5]), roll: 0 } });
  else camera.setView({ destination: C.Cartesian3.fromDegrees(HOME.lon, HOME.lat, HOME.alt * 2.2, E) });
  if (kv.f) { const o = index.find(o => (o.kind === 'feature' ? o.name : o.id) === decodeURIComponent(kv.f)); if (o) setTimeout(() => showInfo(o), 600); }
  return !!m;
}
camera.moveEnd.addEventListener(() => { writeHash(); updateScale(); });
scene.postRender.addEventListener(() => {
  needle.style.transform = `rotate(${-C.Math.toDegrees(camera.heading)}deg)`;
  const c = camera.positionCartographic; camEl.textContent = 'Camera ' + (c.height / 1000).toFixed(c.height < 1e5 ? 1 : 0) + ' km';
});

const hadView = readHash();
if (!hadView) home();
placeOnTerrain().then(() => { if (state.sel) { const o = index.find(o => (o.kind === 'feature' ? o.name : o.id) === state.sel); if (o) showInfo(o); } });
let shown = false;
globe.tileLoadProgressEvent.addEventListener(n => { if (!shown && n === 0) { shown = true; const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); updateScale(); } });
window.encViewer = viewer;
})();
</script>
</body>
</html>
